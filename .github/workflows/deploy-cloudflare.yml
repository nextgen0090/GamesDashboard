# Auto-deploy dashboard to Cloudflare Workers on push to main.
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions
#   CLOUDFLARE_API_TOKEN  — Cloudflare → My Profile → API Tokens → Edit Cloudflare Workers
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard URL or Workers overview

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Require Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist assets exist
        run: |
          test -f dist/index.html
          JS_COUNT=$(find dist/assets -maxdepth 1 -name '*.js' | wc -l)
          CSS_COUNT=$(find dist/assets -maxdepth 1 -name '*.css' | wc -l)
          if [ "$JS_COUNT" -lt 1 ] || [ "$CSS_COUNT" -lt 1 ]; then
            echo "::error::dist/assets is missing JS/CSS. Do not commit dist/ to git — build must run on CI."
            ls -laR dist || true
            exit 1
          fi

      - name: Verify game list in bundle
        run: |
          grep -q "Wonder Voyage" dist/assets/*.js || (echo "::warning::Wonder Voyage not in bundle — check src/data/games.ts" && true)
          ! grep -q "Golden Fortune" dist/assets/*.js || (echo "::error::Old game Golden Fortune still in bundle" && exit 1)

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4'
