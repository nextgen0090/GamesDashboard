# Worker name must match your Cloudflare Worker (or create on first deploy).
# Auto-deploy: push to main → GitHub Actions (.github/workflows/deploy-cloudflare.yml)
#
# Optional Cloudflare Workers Builds (if you use it instead of GitHub Actions):
#   Deploy command: npm ci && npm run deploy

name = "gamesdashboard"
compatibility_date = "2024-12-01"

[assets]
directory = "./dist"
# App has no client-side routes (single `/` only). Avoid serving index.html for
# missing /assets/* files — that causes "MIME type text/html" module errors.
not_found_handling = "404-page"
